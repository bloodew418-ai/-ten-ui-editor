<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="80くじ">
<title>ゲーム企画 80くじ</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#181b20;--card:#21252c;--line:#343a45;--text:#f7f7f8;--muted:#a9b0bb;--accent:#7d6cff;--accent2:#2e294f}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));line-height:1.5}
main{max-width:760px;margin:auto}h1{font-size:26px;margin:0 0 6px}.lead{color:var(--muted);font-size:14px;margin:0 0 16px}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;margin-top:12px}
.label{font-weight:800;font-size:15px}.status{color:var(--muted);font-size:13px;margin-top:4px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#14171c;color:var(--text);min-height:48px;border-radius:12px;padding:10px 12px;font-size:16px;font-weight:700;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.985)}button.active,button.primary{background:var(--accent2);border-color:var(--accent)}button.primary{font-size:18px}
.cards{display:grid;gap:10px;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;display:grid;grid-template-columns:36px 1fr;gap:10px}
.num{font-size:13px;color:var(--muted);font-weight:800;padding-top:2px}.name{font-size:17px;font-weight:900}.desc{font-size:14px;color:var(--muted);margin-top:3px}
.formula{background:#111318;border-radius:12px;padding:13px;font-size:17px;font-weight:900;line-height:1.5;margin-top:10px;word-break:break-word}
.meta{font-size:14px;display:grid;gap:8px;margin-top:10px}.rapid{display:grid;gap:8px;margin-top:10px}.rapid-item{background:#13161b;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:14px;line-height:1.6}.hidden{display:none}
.note{font-size:12px;color:var(--muted);margin:12px 2px 0}@media(min-width:680px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<h1>ゲーム企画 80くじ</h1>
<p class="lead">80個の「面白さパーツ」から重複なしでランダム抽選。変な組み合わせほど残す。</p>

<section class="panel">
<div class="label">何枚引く？</div>
<div id="status" class="status">4枚引き</div>
<div class="btns" id="countBtns">
<button type="button" data-count="1">1</button><button type="button" data-count="3">3</button><button type="button" data-count="4" class="active">4</button><button type="button" data-count="5">5</button>
</div>
<div class="actions">
<button type="button" id="draw" class="primary">🎲 引く</button><button type="button" id="swap">1枚交換</button><button type="button" id="rapid">5セット</button><button type="button" id="reset">リセット</button>
</div>
</section>

<section class="panel"><div class="label">今回の組み合わせ</div><div id="cards" class="cards"></div></section>

<section id="ideaPanel" class="panel hidden">
<div class="label">強制発想</div><div id="formula" class="formula"></div>
<div class="meta"><div><b>核：</b><span id="core"></span></div><div><b>問い：</b><span id="question"></span></div><div><b>縛り：</b>既存ゲーム名から逆算せず、出た要素だけから作る。</div></div>
</section>

<section id="rapidPanel" class="panel hidden"><div class="label">5セット連続</div><div id="rapidResults" class="rapid"></div></section>
<p class="note">iPhoneはSafariの共有メニュー →「ホーム画面に追加」でアプリ風に使えます。</p>
</main>

<script>
(()=>{
const parts=[
["連鎖失敗","小さなミスが次の事故を呼ぶ"],["自動化","作った仕組みが勝手に動く"],["人間心理読み","相手の考えや行動を読む"],["レア現象","めったに起きないことが起こる"],["自由配置","物を好きな場所に置ける"],["持ち帰り","生還・回収して初めて利益になる"],["未知の法則","最初は何が起きるか分からない"],["短い起承転結","1プレイに小さなドラマが生まれる"],["自分だけの戦術","正解が一つではない"],["大事故","派手な崩壊や事故が起きる"],
["結果待ち","実行後の結果を見るのが楽しい"],["全ロスト","失敗すると全部失う"],["拠点発展","小さいものが徐々に育つ"],["視聴者だけ正解を知る","見る側に情報優位がある"],["ドミノ","1つの行動が順番に波及する"],["プレイヤースキル上達","本人の理解と腕が成長する"],["能力合成","複数能力を混ぜて使う"],["資源予測","足りるかどうかを読む"],["笑える失敗","ミス自体がコンテンツになる"],["コレクション","揃えたくなる"],
["環境変化","天候・時間・地形などが変化する"],["隠された場所","秘密の場所を発見する"],["選択型進化","毎回違う成長方向を選ぶ"],["暴走型成長","強くなりすぎて制御不能になる"],["派手に失敗","失敗が視覚的に分かりやすい"],["再現不能な瞬間","同じことが二度と起きない"],["奇跡的成功","普通なら無理なことが通る"],["ルール作成","プレイヤー自身がルールを加える"],["相互依存","一人では成立しない"],["名前を付ける","対象への所有感を生む"],
["予想外の乱入","突然第三者や事件が入る"],["状態異常連鎖","火→爆発→崩壊のようにつながる"],["条件付き現象","特定条件でだけ現象が起きる"],["足を引っ張れる","事故でも故意でも他人を邪魔できる"],["弱→強","明確なパワーアップを味わう"],["一目で状況が分かる","初見でも理解できる"],["リスク選択","安全か欲張るかを選ぶ"],["カスタム","見た目や性能を変える"],["建築","自分で構造物を作る"],["傷・履歴","長く使うほど歴史が残る"],
["連鎖事故","事故が別の事故を呼ぶ"],["物理結果予測","崩れるか耐えるかなどを読む"],["他人の癖が攻略対象","人そのものを読む"],["意外な使い方","想定外の用途を見つける"],["時間制限","急がされることで緊張が生まれる"],["同期","タイミングを合わせる"],["ランダム生成","毎回状況が変わる"],["秘密のルール","表向きと違う法則がある"],["展示","作ったものを他人に見せる"],["自分の判断で事故る","自業自得の失敗が起きる"],
["小→巨大","サイズの成長を楽しむ"],["レア出現","珍しいものがたまに出る"],["組み立て","パーツから何かを作る"],["相手行動予測","次の動きを読む"],["取り返し","失敗後も立て直せる"],["数が増える","少数から大量へ増殖する"],["誤解","意思疎通のズレが遊びになる"],["禁断の選択","やるなと言われたことを試したくなる"],["連鎖成長","育つほどさらに育ちやすくなる"],["個体差","同じ種類でも特徴が違う"],
["軌道予測","投げる・飛ぶ・落ちる軌道を読む"],["1人だけ別情報","プレイヤー間に情報格差がある"],["徐々に理解する世界","遊ぶほど法則が分かる"],["物理事故","想定からズレる挙動が起きる"],["確率判断","運を含めて判断する"],["組み合わせ発見","A+Bから新しい結果を見つける"],["分業","役割を分けて進める"],["1人だけ裏切り候補","協力の中に疑念がある"],["ギリギリ復活","終わったと思ったところから助かる"],["視聴者も予想できる","見る側も結果を考えられる"],
["失敗の痕跡が残る","過去のミスが世界に蓄積する"],["成長が見た目に出る","強さが外見にも反映される"],["経済連鎖","稼ぐ→投資→さらに稼ぐ"],["短い挑戦の反復","短時間で何度も試せる"],["ループする改善","失敗→修正→再挑戦が自然に回る"],["状況だけ変わる","操作は同じでも状況が毎回違う"],["生物育成","育て方で結果が変わる"],["持ちすぎると危険","欲張るほどリスクが上がる"],["観察が楽しい","操作より結果を見ること自体が楽しい"],["キャラ差が出る","人によって遊び方が大きく変わる"]
];
let count=4,current=[];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
function rnd(max){if(max<=1)return 0;if(crypto&&crypto.getRandomValues){const range=4294967296,limit=range-(range%max),a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}return Math.floor(Math.random()*max)}
function draw(n,exclude=[]){const blocked=new Set(exclude),pool=parts.map((_,i)=>i).filter(i=>!blocked.has(i)),out=[];for(let k=0;k<Math.min(n,pool.length);k++){const j=rnd(pool.length);out.push(pool[j]);pool.splice(j,1)}return out}
function card(i){const a=document.createElement("article");a.className="card";const n=document.createElement("div");n.className="num";n.textContent=String(i+1).padStart(2,"0");const b=document.createElement("div"),nm=document.createElement("div"),ds=document.createElement("div");nm.className="name";nm.textContent=parts[i][0];ds.className="desc";ds.textContent=parts[i][1];b.append(nm,ds);a.append(n,b);return a}
function render(){const c=$("#cards");c.replaceChildren(...current.map(card));if(!current.length){$("#ideaPanel").classList.add("hidden");$("#status").textContent=count+"枚引き";return}const names=current.map(i=>parts[i][0]);$("#ideaPanel").classList.remove("hidden");$("#formula").textContent=names.join(" × ");$("#core").textContent="「"+names[0]+"」を主役にして、残りを全部ルールとして混ぜる。";const q=["この要素が全部同時に成立する最小の遊びは何か？","最初の30秒で何をして、1分後に何が起きれば面白いか？","成功より失敗の方が面白くなる形にするとどうなるか？","操作を3種類以内にしたら何が残るか？","実況者が思わず叫ぶ瞬間を1つ作るなら何か？","既存ジャンル名を使わず、この要素だけで1ループを説明できるか？"];$("#question").textContent=q[rnd(q.length)];$("#status").textContent=current.length+"枚："+current.map(i=>String(i+1).padStart(2,"0")).join("・")}
$("#draw").addEventListener("click",()=>{current=draw(count);$("#rapidPanel").classList.add("hidden");render()});
$("#swap").addEventListener("click",()=>{if(!current.length)return;const p=rnd(current.length),r=draw(1,current);if(r.length)current[p]=r[0];render()});
$("#rapid").addEventListener("click",()=>{const box=$("#rapidResults");box.replaceChildren();for(let s=0;s<5;s++){const set=draw(count),row=document.createElement("div");row.className="rapid-item";row.textContent=(s+1)+". "+set.map(i=>parts[i][0]).join(" × ");box.append(row)}$("#rapidPanel").classList.remove("hidden")});
$("#reset").addEventListener("click",()=>{current=[];$("#cards").replaceChildren();$("#ideaPanel").classList.add("hidden");$("#rapidPanel").classList.add("hidden");$("#status").textContent=count+"枚引き"});
$$('#countBtns button').forEach(btn=>btn.addEventListener("click",()=>{count=Math.max(1,Math.min(5,Number(btn.dataset.count)||4));$$('#countBtns button').forEach(b=>b.classList.remove("active"));btn.classList.add("active");$("#status").textContent=count+"枚引き"}));
current=draw(count);render();
})();
</script>
</body>
</html>
