<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="160くじ">
<title>ゲーム企画 160くじ</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#181b20;--card:#21252c;--line:#343a45;--text:#f7f7f8;--muted:#a9b0bb;--accent:#7d6cff;--accent2:#2e294f}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic",sans-serif;padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));line-height:1.5}
main{max-width:760px;margin:auto}h1{font-size:26px;margin:0 0 5px}.version{font-size:12px;color:var(--muted);font-weight:700}.lead{color:var(--muted);font-size:14px;margin:6px 0 16px}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;margin-top:12px}.label{font-weight:800;font-size:15px}.status{color:var(--muted);font-size:13px;margin-top:4px}
.pool-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#14171c;color:var(--text);min-height:48px;border-radius:12px;padding:9px 10px;font-size:15px;font-weight:700;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.985)}button.active,button.primary{background:var(--accent2);border-color:var(--accent)}button.primary{font-size:18px}
.cards{display:grid;gap:10px;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;display:grid;grid-template-columns:38px 1fr;gap:10px}
.num{font-size:13px;color:var(--muted);font-weight:800;padding-top:2px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}.tag{display:inline-block;font-size:11px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.name{font-size:17px;font-weight:900}.desc{font-size:14px;color:var(--muted);margin-top:3px}.formula{background:#111318;border-radius:12px;padding:13px;font-size:17px;font-weight:900;line-height:1.5;margin-top:10px;word-break:break-word}

.copy-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}.copy-status{min-height:20px;color:var(--muted);font-size:13px;margin-top:6px}.hidden{display:none}.rule-note{font-size:13px;color:var(--muted);margin-top:10px;padding:10px 11px;border-left:3px solid var(--accent);background:#13161b;border-radius:8px}
.note{font-size:12px;color:var(--muted);margin:12px 2px 0}@media(min-width:680px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<h1>ゲーム企画 160くじ</h1>
<div class="version">v3.0 / 元80 ＋ 既視感破壊80</div>
<p class="lead">元の「面白さ80」を消さず、新しい「既視感破壊80」を追加。合計160要素から完全ランダムで組み合わせる。</p>

<section class="panel">
<div class="label">抽選範囲</div>
<div class="pool-btns" id="poolBtns">
<button type="button" data-pool="all" class="active">全160</button>
<button type="button" data-pool="old">元80</button>
<button type="button" data-pool="new">新80</button>
</div>
<div class="label" style="margin-top:14px">何枚引く？</div>
<div id="status" class="status">全160から4枚引き</div>
<div class="btns" id="countBtns">
<button type="button" data-count="1">1</button><button type="button" data-count="3">3</button><button type="button" data-count="4" class="active">4</button><button type="button" data-count="5">5</button>
</div>
<div class="actions">
<button type="button" id="draw" class="primary">🎲 引く</button><button type="button" id="swap">1枚交換</button><button type="button" id="rapid">5セット</button><button type="button" id="reset">リセット</button>
</div>
<div class="rule-note">抽選は選択した範囲から重複なしの完全ランダム。全160なら「基礎の面白さ」と「変な世界法則」が偶然ぶつかる。</div>
</section>

<section class="panel">
<div class="label">今回の組み合わせ</div><div id="cards" class="cards"></div>
<div class="copy-area"><textarea id="copyText" class="copybox" readonly aria-label="コピペ用抽選結果"></textarea>
<div class="copy-actions"><button type="button" id="copyCurrent" class="primary">📋 結果をコピー</button></div><div id="copyStatus" class="copy-status" aria-live="polite"></div></div>
</section>

<section id="ideaPanel" class="panel hidden">
<div class="label">強制発想</div><div id="formula" class="formula"></div>
<div class="meta"><div><b>核：</b><span id="core"></span></div><div><b>問い：</b><span id="question"></span></div><div><b>縛り：</b>既存ゲーム名から逆算しない。出た要素同士を一度は文字通り衝突させる。</div></div>
</section>

<section id="rapidPanel" class="panel hidden">
<div class="label">5セット連続</div><div id="rapidResults" class="rapid"></div>
<div class="copy-actions"><button type="button" id="copyRapid">📋 5セットをコピー</button></div><div id="rapidCopyStatus" class="copy-status" aria-live="polite"></div>
</section>
<p class="note">Safariの共有 →「ホーム画面に追加」でアプリ風に使えます。</p>
</main>

let count=4,poolMode="all",current=[],rapidSets=[];

function rnd(max){if(max<=1)return 0;if(window.crypto&&crypto.getRandomValues){const range=4294967296,limit=range-(range%max),a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}return Math.floor(Math.random()*max)}
function poolIndexes(){return parts.map((_,i)=>i).filter(i=>poolMode==="all"||(poolMode==="old"&&parts[i][0]==="元80")||(poolMode==="new"&&parts[i][0]==="新80"))}
function draw(n,exclude=[]){const blocked=new Set(exclude),pool=poolIndexes().filter(i=>!blocked.has(i)),out=[];for(let k=0;k<Math.min(n,pool.length);k++){const j=rnd(pool.length);out.push(pool[j]);pool.splice(j,1)}return out}
function poolLabel(){return poolMode==="all"?"全160":poolMode==="old"?"元80":"新80"}
