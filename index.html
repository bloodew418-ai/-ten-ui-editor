<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>TEN UI EDITOR</title>
<meta name="theme-color" content="#12141a">
<style>html,body{margin:0;background:#12141a;color:#e8eaf0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}</style>
</head>
<body>
<script>
(function(){
  var css='jog-v012.css', patchCss='jog-v017-patch.css';
  var js='jog-v012.js', patchJs='jog-v017-patch.js';
  fetch('./index-v0.1.1.html',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('core');return r.text();})
    .then(function(html){
      if(html.indexOf(css)<0){
        html=html.replace('</head>','<link rel="stylesheet" href="'+css+'"></head>');
      }
      if(html.indexOf(patchCss)<0){
        html=html.replace('</head>','<link rel="stylesheet" href="'+patchCss+'"></head>');
      }
      html=html.replace('<span>v0.1.1</span>','<span>v0.1.10</span>');
      if(html.indexOf(js)<0){
        html=html.replace('</body>','<script src="'+js+'"><'+'/script></body>');
      }
      if(html.indexOf(patchJs)<0){
        html=html.replace('</body>','<script src="'+patchJs+'"><'+'/script></body>');
      }
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(){location.replace('./index-v0.1.1.html');});
})();
</script>
</body>
</html>
